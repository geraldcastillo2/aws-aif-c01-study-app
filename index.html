<head>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-aws: #ff9900;
            --accent-aws-hover: #e68a00;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border-color: #334155;
            --sidebar-width: 320px;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(15, 23, 42, 0.5);
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-aws);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .nav-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 16px 20px 8px 20px;
            font-weight: 600;
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .nav-item:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: rgba(255, 153, 0, 0.1);
            color: var(--accent-aws);
            border-left-color: var(--accent-aws);
            font-weight: 600;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .top-bar {
            height: 60px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .top-bar h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent-aws);
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-aws-hover);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .content-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h3 {
            color: var(--accent-aws);
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;

            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .card ul {
            padding-left: 20px;
        }

        .card li {
            margin-bottom: 6px;
        }

            background-color: rgba(255, 153, 0, 0.05);
            border-left: 4px solid var(--accent-aws);
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 0 6px 6px 0;

            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .question-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .option-item:hover {
            border-color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.02);
        }

        .option-item.selected {
            border-color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.1);
        }

        .option-item.correct {
            border-color: var(--success);
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .option-item.incorrect {
            border-color: var(--error);
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .explanation {
            margin-top: 16px;
            padding: 16px;
            background-color: rgba(51, 65, 85, 0.5);
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .explanation strong {
            color: var(--accent-aws);
            display: block;
            margin-bottom: 4px;
        }

        .results-card {
            text-align: center;
            padding: 40px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--accent-aws);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 20px auto;
            color: var(--accent-aws);
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;

            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;

            color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.1);

            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent-aws);
            font-weight: 600;
