<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certified AI Practitioner (AIF-C01) Master Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-aws: #ff9900;
            --accent-aws-hover: #e68a00;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border-color: #334155;
            --sidebar-width: 300px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(15, 23, 42, 0.5);
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-aws);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .nav-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 16px 20px 8px 20px;
            font-weight: 600;
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .nav-item:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: rgba(255, 153, 0, 0.1);
            color: var(--accent-aws);
            border-left-color: var(--accent-aws);
            font-weight: 600;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .badge.completed {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        /* Main Content Area */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .top-bar {
            height: 60px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .top-bar h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent-aws);
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-aws-hover);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .content-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Study Notes Cards */
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h3 {
            color: var(--accent-aws);
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .card p, .card ul {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .card ul {
            padding-left: 20px;
        }

        .card li {
            margin-bottom: 6px;
        }

        .highlight-box {
            background-color: rgba(255, 153, 0, 0.05);
            border-left: 4px solid var(--accent-aws);
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 0 6px 6px 0;
        }

        .highlight-box strong {
            color: var(--text-primary);
        }

        /* Quiz UI */
        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .question-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .option-item:hover {
            border-color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.02);
        }

        .option-item.selected {
            border-color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.1);
        }

        .option-item.correct {
            border-color: var(--success);
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .option-item.incorrect {
            border-color: var(--error);
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .explanation {
            margin-top: 16px;
            padding: 16px;
            background-color: rgba(51, 65, 85, 0.5);
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .explanation strong {
            color: var(--accent-aws);
            display: block;
            margin-bottom: 4px;
        }

        /* Results Screen */
        .results-card {
            text-align: center;
            padding: 40px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--accent-aws);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 20px auto;
            color: var(--accent-aws);
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active {
            color: var(--accent-aws);
            background-color: rgba(255, 153, 0, 0.1);
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent-aws);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>AWS AI Practitioner</h1>
            <p>AIF-C01 Official Exam Prep App</p>
        </div>

        <div class="nav-section-title">Course Modules (10)</div>
        <ul class="nav-list" id="module-nav"></ul>

        <div class="nav-section-title">Full Practice Exams (3)</div>
        <ul class="nav-list" id="exam-nav"></ul>
    </aside>

    <main id="main-content">
        <header class="top-bar">
            <h2 id="view-title">Module 1: AI & ML Fundamentals</h2>
            <div class="top-actions">
                <div id="exam-timer" class="timer-display" style="display: none;">90:00</div>
                <button id="toggle-quiz-btn" class="btn btn-primary" onclick="toggleMode()">Take Module Quiz</button>
            </div>
        </header>

        <div class="content-scroll">
            <div class="container">
                <!-- Notes Container -->
                <div id="notes-view"></div>

                <!-- Quiz Container -->
                <div id="quiz-view" class="quiz-container">
                    <div class="tab-buttons">
                        <button class="tab-btn active" id="quiz-mode-btn" onclick="setQuizTab('questions')">Questions</button>
                        <button class="tab-btn" id="results-tab-btn" onclick="setQuizTab('results')" style="display: none;">Score & Breakdown</button>
                    </div>

                    <div id="quiz-questions-container"></div>
                    <div id="quiz-results-container" style="display: none;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- APP DATA ARCHITECTURE ---
        const courseData = {
            modules: [
                {
                    id: 1,
                    title: "Module 1: AI & ML Fundamentals",
                    notes: `
                        <div class="card">
                            <h3>1. AI, Machine Learning, and Deep Learning Hierarchy</h3>
                            <p>Understanding the exact boundaries between AI disciplines is fundamental for AWS certification:</p>
                            <ul>
                                <li><strong>Artificial Intelligence (AI):</strong> Broad field of computer science focused on building systems capable of performing tasks that typically require human intelligence.</li>
                                <li><strong>Machine Learning (ML):</strong> A subset of AI where mathematical algorithms learn statistical patterns directly from data without explicit procedural programming.</li>
                                <li><strong>Deep Learning (DL):</strong> A specialized subset of ML using multi-layered Artificial Neural Networks (ANNs) to automatically extract complex features from unstructured data (images, audio, free text).</li>
                            </ul>
                        </div>
                        <div class="card">
                            <h3>2. Machine Learning Paradigms & Core Tasks</h3>
                            <p>AWS exams test your ability to map business problems to the correct ML approach:</p>
                            <ul>
                                <li><strong>Supervised Learning:</strong> Algorithms trained on <em>labeled datasets</em> ($X \rightarrow Y$).
                                    <ul>
                                        <li><em>Classification:</em> Predicting discrete categorical labels (e.g., Spam vs. Non-Spam, Fraudulent vs. Legitimate).</li>
                                        <li><em>Regression:</em> Predicting continuous numerical values (e.g., Real estate pricing, sales forecasts).</li>
                                    </ul>
                                </li>
                                <li><strong>Unsupervised Learning:</strong> Algorithms discovering hidden patterns or groupings in <em>unlabeled datasets</em>.
                                    <ul>
                                        <li><em>Clustering:</em> Grouping similar data points without pre-assigned labels (e.g., Customer segmentation, anomaly discovery).</li>
                                        <li><em>Dimensionality Reduction (e.g., PCA):</em> Compressing input features while retaining key variance.</li>
                                    </ul>
                                </li>
                                <li><strong>Reinforcement Learning (RL):</strong> An agent learns optimal decision-making via trial and error inside an environment using rewards and penalties.</li>
                            </ul>
                        </div>
                        <div class="card">
                            <h3>3. Complete ML Development Lifecycle</h3>
                            <p>You must know the sequential stages of deploying ML models in enterprise environments:</p>
                            <div class="highlight-box">
                                <strong>Lifecycle Stages:</strong> Problem Formulation $\rightarrow$ Data Collection & Ingestion $\rightarrow$ Data Preprocessing & Cleaning $\rightarrow$ Feature Engineering $\rightarrow$ Model Training & Hyperparameter Tuning $\rightarrow$ Model Evaluation $\rightarrow$ Model Deployment (Inference) $\rightarrow$ Continuous Monitoring.
                            </div>
                            <ul>
                                <li><strong>Feature Engineering:</strong> Transforming raw variables into optimized numerical representations (e.g., word embeddings, one-hot encoding).</li>
                                <li><strong>Ground Truth:</strong> The objective real-world facts or true target labels used for training and evaluating predictions.</li>
                                <li><strong>Data Drift / Concept Drift:</strong> Degradation of model accuracy in production due to changing real-world statistical distributions over time.</li>
                            </ul>
                        </div>
                    `,
                    questions: [
                        {
                            q: "A bank wants to categorize customer credit applications into 'High Risk' or 'Low Risk' using historical data with known repayment outcomes. Which ML paradigm is required?",
                            options: ["Unsupervised Learning - Clustering", "Supervised Learning - Classification", "Supervised Learning - Regression", "Reinforcement Learning"],
                            answer: 1,
                            explanation: "Since historical data contains known pre-assigned labels ('High Risk' or 'Low Risk') and the target output is categorical, this is a Supervised Learning Classification problem."
                        },
                        {
                            q: "What is the primary difference between Deep Learning (DL) and traditional Machine Learning (ML)?",
                            options: [
                                "DL requires smaller datasets than traditional ML.",
                                "DL relies on multi-layer neural networks that extract features automatically from unstructured data.",
                                "Traditional ML only runs on GPU instances, while DL runs on basic CPUs.",
                                "DL is limited strictly to rule-based decision trees."
                            ],
                            answer: 1,
                            explanation: "Deep Learning utilizes deep neural network architectures to automatically learn hierarchical representations directly from raw data without manual feature extraction."
                        },
                        {
                            q: "An e-commerce company groups customers into distinct marketing segments based on buying habits without pre-existing category labels. What approach is being used?",
                            options: ["Supervised Regression", "Unsupervised Clustering", "Reinforcement Learning", "Binary Classification"],
                            answer: 1,
                            explanation: "Unsupervised Clustering identifies natural groupings or patterns in unlabeled datasets."
                        },
                        {
                            q: "A machine learning model deployed in production gradually experiences declining prediction accuracy because customer shopping behavior changed over time. What phenomenon is occurring?",
                            options: ["Overfitting during inference", "Data/Concept Drift", "Hyperparameter misconfiguration", "Underfitting on test data"],
                            answer: 1,
                            explanation: "Data or Concept Drift refers to the statistical divergence of real-world production inputs relative to original training data over time."
                        },
                        {
                            q: "In the ML development lifecycle, what does 'Ground Truth' refer to?",
                            options: [
                                "The real-world, verified accurate target values/labels used for training and testing.",
                                "The baseline hardware performance metrics of an AWS EC2 instance.",
                                "The prompt instructions provided to an LLM.",
                                "The output generated by an uncalibrated model."
                            ],
                            answer: 0,
                            explanation: "Ground Truth is the verified target value or factual label used as the benchmark to measure prediction accuracy."
                        }
                    ]
                },
                {
                    id: 2,
                    title: "Module 2: Generative AI (GenAI) Fundamentals",
                    notes: `
                        <div class="card">
                            <h3>1. Traditional ML vs. Generative AI</h3>
                            <p>Understanding the fundamental distinction between analytical ML and Generative AI:</p>
                            <ul>
                                <li><strong>Discriminative/Traditional ML:</strong> Models that analyze, classify, or predict probabilities over existing data ($P(Y|X)$). Example: Determining if an image is a dog or a cat.</li>
                                <li><strong>Generative AI (GenAI):</strong> Deep learning models trained on vast datasets to output brand new, original content ($P(X, Y)$) across modalities (text, code, synthetic audio, images, video).</li>
                            </ul>
                        </div>
                        <div class="card">
                            <h3>2. Foundation Models (FMs) & Transformer Architecture</h3>
                            <ul>
                                <li><strong>Foundation Models (FMs):</strong> Large-scale deep learning models pre-trained on massive multi-modal datasets, capable of being adapted to diverse downstream tasks.</li>
                                <li><strong>Transformer Architecture:</strong> Introduced in 2017, utilizing <em>Self-Attention Mechanisms</em> to process entire sequences of text in parallel rather than sequentially, understanding complex contextual relationships across tokens.</li>
                                <li><strong>Tokens:</strong> Basic units of text (words, sub-words, or characters) processed by models. Typically 1,000 tokens equal roughly 750 English words.</li>
                                <li><strong>Context Window:</strong> The maximum token limit (input prompt + generated output) an LLM can process in a single inference pass.</li>
                            </ul>
                        </div>
                        <div class="card">
                            <h3>3. Key Limitations & Risk Parameters</h3>
                            <ul>
                                <li><strong>Hallucinations:</strong> Instances where a generative model confidentially outputs factually incorrect, ungrounded, or fabricated information.</li>
                                <li><strong>Knowledge Cutoff:</strong> The specific date up to which training data was collected; the model lacks inherent awareness of events after this date.</li>
                                <li><strong>Inference Parameters:</strong>
                                    <ul>
                                        <li><em>Temperature:</em> Controls randomness. Low temperature (e.g., 0.1) produces factual, deterministic outputs; high temperature (e.g., 0.8) yields creative outputs.</li>
                                        <li><em>Top-P (Nucleus Sampling):</em> Filters choices to tokens cumulative probability $P$.</li>
                                        <li><em>Top-K:</em> Truncates selection to the top $K$ most probable next tokens.</li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    `,
                    questions: [
                        {
                            q: "What is the primary architectural innovation of Transformers over traditional Recurrent Neural Networks (RNNs)?",
                            options: [
                                "Parallel processing of sequence tokens using Self-Attention mechanisms.",
                                "Sequential processing of text one character at a time.",
                                "Elimination of deep neural layers.",
                                "Requirement of manual feature engineering."
                            ],
                            answer: 0,
                            explanation: "Transformers process entire input sequences in parallel using self-attention, bypassing the sequential bottleneck of RNNs."
                        },
                        {
                            q: "An AI practitioner configures an LLM with a Temperature parameter of 0.0. What output behavior will this produce?",
                            options: [
                                "Highly creative and unpredictable responses.",
                                "Strictly deterministic responses choosing the most probable token every time.",
                                "An immediate runtime timeout error.",
                                "Generates empty string responses."
                            ],
                            answer: 1,
                            explanation: "A temperature of 0.0 removes randomness, making predictions deterministic by selecting top-ranked probability tokens."
                        },
                        {
                            q: "An LLM provides an incorrect date for a recent current event that took place last week, despite speaking with high confidence. What two issues are demonstrated?",
                            options: [
                                "Overfitting and Underfitting",
                                "Hallucination and Knowledge Cutoff limitation",
                                "Data Drift and Concept Drift",
                                "SQL Injection and Prompt Leakage"
                            ],
                            answer: 1,
                            explanation: "Fabricating plausible-sounding facts is a Hallucination; lack of awareness regarding recent post-training events stems from the Knowledge Cutoff."
                        },
                        {
                            q: "What is a 'Token' in the context of Large Language Models?",
                            options: [
                                "A security pass key used in AWS IAM.",
                                "The fundamental unit of text (word or sub-word) processed by the model.",
                                "An encrypted record stored inside Amazon S3.",
                                "The GPU instance type used for training."
                            ],
                            answer: 1,
                            explanation: "Tokens are numerical representations of words or character chunks used by LLMs during processing."
                        },
                        {
                            q: "Which inference parameter bounds next-token sampling to a cumulative probability threshold?",
                            options: ["Temperature", "Top-P (Nucleus Sampling)", "Top-K", "Stop Sequence"],
                            answer: 1,
                            explanation: "Top-P samples from the smallest set of tokens whose cumulative probability exceeds threshold $P$."
                        }
                    ]
                }
            ],
            exams: [
                {
                    id: 1,
                    title: "Practice Exam 1 (40 Questions)",
                    questions: [
                        {
                            q: "A company wants to build a conversational chatbot that queries an internal knowledge base without modifying underlying model weights. Which pattern fits best?",
                            options: ["Full Model Pre-training", "Retrieval-Augmented Generation (RAG)", "Unsupervised Clustering", "Fine-Tuning with Ground Truth"],
                            answer: 1,
                            explanation: "RAG retrieves external data from vector databases to augment prompts in real-time without costly retraining or fine-tuning."
                        },
                        {
                            q: "Which AWS service provides serverless access to leading Foundation Models via an API?",
                            options: ["Amazon SageMaker Canvas", "Amazon Bedrock", "AWS Lambda", "Amazon EC2 UltraClusters"],
                            answer: 1,
                            explanation: "Amazon Bedrock is a fully managed serverless service offering API access to leading foundation models from AI21, Anthropic, Cohere, Meta, Stability AI, and Amazon."
                        }
                    ]
                }
            ]
        };

        // --- STATE MANAGEMENT ---
        let state = {
            currentModuleId: 1,
            isExamMode: false,
            activeTab: 'notes',
            answers: {},
            examAnswers: {},
            timerInterval: null,
            timeLeft: 5400
        };

        // --- RENDER ENGINE ---
        function initApp() {
            renderNav();
            loadModule(1);
        }

        function renderNav() {
            const moduleList = document.getElementById('module-nav');
            moduleList.innerHTML = courseData.modules.map(m => `
                <li class="nav-item ${m.id === state.currentModuleId && !state.isExamMode ? 'active' : ''}" onclick="selectModule(${m.id})">
                    <span>${m.title.split(':')[0]}</span>
                    <span class="badge">${m.questions.length} Qs</span>
                </li>
            `).join('');

            const examList = document.getElementById('exam-nav');
            examList.innerHTML = courseData.exams.map(e => `
                <li class="nav-item ${e.id === state.currentModuleId && state.isExamMode ? 'active' : ''}" onclick="selectExam(${e.id})">
                    <span>${e.title}</span>
                    <span class="badge">Exam</span>
                </li>
            `).join('');
        }

        function selectModule(id) {
            state.currentModuleId = id;
            state.isExamMode = false;
            state.activeTab = 'notes';
            renderNav();
            loadModule(id);
        }

        function selectExam(id) {
            state.currentModuleId = id;
            state.isExamMode = true;
            state.activeTab = 'quiz';
            renderNav();
            loadExam(id);
        }

        function loadModule(id) {
            const module = courseData.modules.find(m => m.id === id);
            document.getElementById('view-title').innerText = module.title;
            document.getElementById('notes-view').style.display = 'block';
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('toggle-quiz-btn').innerText = 'Take Module Quiz';
            document.getElementById('toggle-quiz-btn').style.display = 'block';
            document.getElementById('exam-timer').style.display = 'none';

            document.getElementById('notes-view').innerHTML = module.notes;
            renderQuizQuestions(module.questions);
        }

        function loadExam(id) {
            const exam = courseData.exams.find(e => e.id === id);
            document.getElementById('view-title').innerText = exam.title;
            document.getElementById('notes-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            document.getElementById('quiz-view').classList.add('active');
            document.getElementById('toggle-quiz-btn').style.display = 'none';
            document.getElementById('exam-timer').style.display = 'block';

            renderQuizQuestions(exam.questions);
            startTimer();
        }

        function toggleMode() {
            const notesView = document.getElementById('notes-view');
            const quizView = document.getElementById('quiz-view');
            const btn = document.getElementById('toggle-quiz-btn');

            if (quizView.style.display === 'none' || !quizView.style.display) {
                notesView.style.display = 'none';
                quizView.style.display = 'block';
                quizView.classList.add('active');
                btn.innerText = 'Back to Notes';
            } else {
                notesView.style.display = 'block';
                quizView.style.display = 'none';
                quizView.classList.remove('active');
                btn.innerText = 'Take Module Quiz';
            }
        }

        function renderQuizQuestions(questions) {
            const container = document.getElementById('quiz-questions-container');
            container.innerHTML = questions.map((q, qIndex) => `
                <div class="question-card" id="q-card-${qIndex}">
                    <div class="question-header">
                        <span>Question ${qIndex + 1} of ${questions.length}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-list">
                        ${q.options.map((opt, oIndex) => `
                            <div class="option-item" id="opt-${qIndex}-${oIndex}" onclick="selectOption(${qIndex},${oIndex})">
                                <strong>${String.fromCharCode(65 + oIndex)}.</strong>${opt}
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${qIndex}" style="display: none;">
                        <strong>AWS Exam Explanation:</strong>
                        ${q.explanation}
                    </div>
                </div>
            `).join('') + `
                <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 20px;" onclick="submitQuiz()">Submit Answers</button>
            `;
        }

        function selectOption(qIndex, oIndex) {
            state.answers[qIndex] = oIndex;
            const parent = document.getElementById(`q-card-${qIndex}`);
            const options = parent.querySelectorAll('.option-item');
            options.forEach((opt, idx) => {
                if (idx === oIndex) opt.classList.add('selected');
                else opt.classList.remove('selected');
            });
        }

        function submitQuiz() {
            const questions = state.isExamMode 
                ? courseData.exams.find(e => e.id === state.currentModuleId).questions 
                : courseData.modules.find(m => m.id === state.currentModuleId).questions;

            let score = 0;
            questions.forEach((q, qIndex) => {
                const selected = state.answers[qIndex];
                const exp = document.getElementById(`exp-${qIndex}`);
                if (exp) exp.style.display = 'block';

                q.options.forEach((_, oIndex) => {
                    const optEl = document.getElementById(`opt-${qIndex}-${oIndex}`);
                    if (!optEl) return;

                    if (oIndex === q.answer) {
                        optEl.classList.add('correct');
                    }
                    if (selected === oIndex && selected !== q.answer) {
                        optEl.classList.add('incorrect');
                    }
                });

                if (selected === q.answer) score++;
            });

            // Show summary
            document.getElementById('results-tab-btn').style.display = 'inline-block';
            setQuizTab('results');
            renderResults(score, questions.length);
        }

        function renderResults(score, total) {
            const percentage = Math.round((score / total) * 100);
            const passed = percentage >= 75;
            const resultsContainer = document.getElementById('quiz-results-container');
            resultsContainer.innerHTML = `
                <div class="card results-card">
                    <h3>${passed ? 'PASSED! 🎉' : 'KEEP STUDYING! 📚'}</h3>
                    <div class="score-circle" style="border-color: ${passed ? 'var(--success)' : 'var(--error)'}; color: ${passed ? 'var(--success)' : 'var(--error)'}">
                        ${percentage}%
                    </div>
                    <p>You answered <strong>${score}</strong> out of <strong>${total}</strong> questions correctly.</p>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">AWS Official Passing Score Threshold: 75% (750/1000 scaled score)</p>
                    <button class="btn btn-secondary" style="margin-top: 20px;" onclick="setQuizTab('questions')">Review Detailed Answers</button>
                </div>
            `;
        }

        function setQuizTab(tab) {
            state.activeTab = tab;
            const qBtn = document.getElementById('quiz-mode-btn');
            const rBtn = document.getElementById('results-tab-btn');
            const qContainer = document.getElementById('quiz-questions-container');
            const rContainer = document.getElementById('quiz-results-container');

            if (tab === 'questions') {
                qBtn.classList.add('active');
                rBtn.classList.remove('active');
                qContainer.style.display = 'block';
                rContainer.style.display = 'none';
            } else {
                rBtn.classList.add('active');
                qBtn.classList.remove('active');
                qContainer.style.display = 'none';
                rContainer.style.display = 'block';
            }
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.timeLeft = 5400; // 90 mins
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                const mins = Math.floor(state.timeLeft / 60);
                const secs = state.timeLeft % 60;
                document.getElementById('exam-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
